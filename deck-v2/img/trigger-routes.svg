<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 256" role="img" aria-labelledby="title desc"><title id="title">Four ways to start one workflow run</title><desc id="desc">Four numbered routes converge on one workflow run: something happens in the repository (push, issue or pull request), a clock (daily or cron), a person presses a button (workflow_dispatch), or a comment says so (slash_command).</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37;--blue-soft:#ddf4ff;--green-soft:#dafbe1;--warn-soft:#fff8c5;--white:#ffffff}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}.write{fill:var(--green-soft);stroke:var(--green);stroke-width:2}.warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.card{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.h{fill:var(--ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.t{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:var(--hi);font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.mt{fill:var(--hi);font:18px ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:var(--warn);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.g{fill:var(--green);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lab{fill:var(--hi);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 6}.ring{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.n{fill:var(--blue)}.nw{fill:var(--warn)}.ng{fill:var(--green)}.nt{fill:var(--white);font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker></defs>
<rect x="1" y="1" width="268" height="124" rx="12" class="box"/><circle cx="41" cy="42" r="26" class="focus"/><g transform="translate(41,42)" fill="none" stroke="#0550ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 -14 L-8 2 H0 L-3 14 L8 -3 H0 Z"/></g><circle cx="241" cy="24" r="13" class="n"/><text x="241" y="30" class="nt">1</text><text x="17" y="94" class="h">Something happens</text><text x="17" y="116" class="mt">push, issue or PR</text>
<rect x="285" y="1" width="268" height="124" rx="12" class="box"/><circle cx="325" cy="42" r="26" class="focus"/><g transform="translate(325,42)" fill="none" stroke="#0550ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle r="14"/><path d="M0 -8 V0 L7 4"/></g><circle cx="525" cy="24" r="13" class="n"/><text x="525" y="30" class="nt">2</text><text x="301" y="94" class="h">A clock</text><text x="301" y="116" class="mt">daily / cron</text>
<rect x="569" y="1" width="268" height="124" rx="12" class="box"/><circle cx="609" cy="42" r="26" class="focus"/><g transform="translate(609,42)" fill="none" stroke="#0550ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle r="14"/><path d="M-5 -7 L9 0 L-5 7 Z"/></g><circle cx="809" cy="24" r="13" class="n"/><text x="809" y="30" class="nt">3</text><text x="585" y="94" class="h">A person presses go</text><text x="585" y="116" class="mt">workflow_dispatch</text>
<rect x="853" y="1" width="268" height="124" rx="12" class="box"/><circle cx="893" cy="42" r="26" class="focus"/><g transform="translate(893,42)" fill="none" stroke="#0550ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -11 H14 V6 H-2 L-9 13 V6 H-14 Z"/></g><circle cx="1093" cy="24" r="13" class="n"/><text x="1093" y="30" class="nt">4</text><text x="869" y="94" class="h">A comment says so</text><text x="869" y="116" class="mt">slash_command</text>
<path d="M135 125 V160 H1001 M419 125 V160 M703 125 V160 M1001 125 V160" class="line"/><path d="M568 160 V186" class="line" marker-end="url(#arrow)"/><rect x="368" y="188" width="400" height="64" rx="12" class="focus"/><text x="568" y="228" class="h" text-anchor="middle" style="font-size:24px">One workflow run</text>
</svg>
