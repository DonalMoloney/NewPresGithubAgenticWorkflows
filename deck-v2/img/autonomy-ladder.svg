<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 330" role="img" aria-labelledby="title desc"><title id="title">Five illustrative autonomy levels</title><desc id="desc">L1 Operator through L5 Observer. L4 Approver is highlighted as this deck’s interpretation of gh-aw, not a classification from GitHub or the paper.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#ddf4ff;stroke:var(--blue);stroke-width:2}.write{fill:#dafbe1;stroke:var(--green);stroke-width:2}.warn{fill:#fff8c5;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono-h{fill:var(--hi);font:600 26px ui-monospace,SFMono-Regular,Consolas,monospace}.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wtext{fill:var(--warn);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.code{fill:var(--hi);font:20px ui-monospace,SFMono-Regular,Consolas,monospace}.cap{fill:var(--muted);font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.rule{fill:none;stroke:var(--line);stroke-width:1.5}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}.zone{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs>
<text x="1" y="24" class="label">MORE AGENT AUTONOMY →</text>
<rect x="1" y="212" width="214" height="108" rx="12" class="box"/>
<text x="21" y="246" class="label">L1</text>
<text x="21" y="276" class="heading">Operator</text>
<text x="21" y="304" class="text">Human drives</text>
<rect x="231" y="164" width="214" height="108" rx="12" class="box"/>
<text x="251" y="198" class="label">L2</text>
<text x="251" y="228" class="heading">Collaborator</text>
<text x="251" y="256" class="text">Human co-plans</text>
<rect x="461" y="116" width="214" height="108" rx="12" class="box"/>
<text x="481" y="150" class="label">L3</text>
<text x="481" y="180" class="heading">Consultant</text>
<text x="481" y="208" class="text">Human advises</text>
<rect x="691" y="68" width="214" height="108" rx="12" class="focus"/>
<text x="711" y="102" class="label">L4</text>
<text x="711" y="132" class="heading">Approver</text>
<text x="711" y="160" class="text">Human signs off</text>
<rect x="921" y="20" width="214" height="108" rx="12" class="box"/>
<text x="941" y="54" class="label">L5</text>
<text x="941" y="84" class="heading">Observer</text>
<text x="941" y="112" class="text">Human watches</text>
<text x="798" y="254" class="cap" text-anchor="middle">gh-aw: this deck’s interpretation</text>
<path d="M798 232 V177" class="line" marker-end="url(#arrow)"/>
</svg>
