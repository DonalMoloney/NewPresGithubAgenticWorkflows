<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 340" role="img" aria-labelledby="title desc"><title id="title">Five illustrative autonomy levels</title><desc id="desc">A rising staircase of five levels, L1 Operator through L5 Observer, with a dotted path climbing the steps. L4 Approver is highlighted and numbered 1 as this deck’s interpretation of where gh-aw sits, not a classification from GitHub or the paper.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37;--blue-soft:#ddf4ff;--green-soft:#dafbe1;--warn-soft:#fff8c5;--white:#ffffff}
.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.focus{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}.write{fill:var(--green-soft);stroke:var(--green);stroke-width:2}.warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.card{fill:var(--white);stroke:var(--line);stroke-width:2}
.h{fill:var(--ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.t{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:var(--hi);font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.mt{fill:var(--hi);font:18px ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:var(--warn);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.g{fill:var(--green);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lab{fill:var(--hi);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 6}.ring{fill:var(--white);stroke:var(--line);stroke-width:2}
.n{fill:var(--blue)}.nw{fill:var(--warn)}.ng{fill:var(--green)}.nt{fill:var(--white);font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker></defs>
<text x="2" y="20" class="lab">MORE AGENT AUTONOMY →</text>
<path d="M1 336 V232 a12 12 0 0 1 12 -12 H203 a12 12 0 0 1 12 12 V336 Z" class="box"/><text x="21" y="254" class="lab">L1</text><text x="21" y="284" class="h" style="font-size:26px">Operator</text><text x="21" y="312" class="t" style="font-size:20px">Human drives</text>
<path d="M231 336 V182 a12 12 0 0 1 12 -12 H433 a12 12 0 0 1 12 12 V336 Z" class="box"/><text x="251" y="204" class="lab">L2</text><text x="251" y="234" class="h" style="font-size:26px">Collaborator</text><text x="251" y="262" class="t" style="font-size:20px">Human co-plans</text>
<path d="M461 336 V132 a12 12 0 0 1 12 -12 H663 a12 12 0 0 1 12 12 V336 Z" class="box"/><text x="481" y="154" class="lab">L3</text><text x="481" y="184" class="h" style="font-size:26px">Consultant</text><text x="481" y="212" class="t" style="font-size:20px">Human advises</text>
<path d="M691 336 V82 a12 12 0 0 1 12 -12 H893 a12 12 0 0 1 12 12 V336 Z" class="focus"/><text x="711" y="104" class="lab">L4</text><text x="711" y="134" class="h" style="font-size:26px">Approver</text><text x="711" y="162" class="t" style="font-size:20px">Human signs off</text>
<path d="M921 336 V32 a12 12 0 0 1 12 -12 H1123 a12 12 0 0 1 12 12 V336 Z" class="box"/><text x="941" y="54" class="lab">L5</text><text x="941" y="84" class="h" style="font-size:26px">Observer</text><text x="941" y="112" class="t" style="font-size:20px">Human watches</text>
<path d="M108 204 L338 154 L568 104 L798 54 L1028 4" class="line" style="stroke-dasharray:3 7;stroke-linecap:round"/>
<circle cx="108" cy="204" r="6" class="n"/><circle cx="338" cy="154" r="6" class="n"/><circle cx="568" cy="104" r="6" class="n"/><circle cx="798" cy="54" r="9" class="n"/><circle cx="1028" cy="4" r="6" class="n"/><text x="711" y="214" class="w" style="font-size:22px">gh-aw sits here</text><text x="711" y="242" class="t" style="font-size:20px">this deck’s reading</text>

</svg>
