<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc"><title id="title">Five illustrative autonomy levels</title><desc id="desc">L1 Operator through L5 Observer. L4 Approver is highlighted as this deck’s interpretation of gh-aw, not a classification from GitHub or the paper.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.write{fill:#132218;stroke:var(--green);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:1.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker></defs><text x="12" y="24" class="label">MORE AGENT AUTONOMY →</text><rect x="12" y="154" width="208" height="112" rx="12" class="box"/><text x="28" y="184" class="label">L1</text><text x="28" y="215" class="heading">Operator</text><text x="28" y="248" class="text">Human drives</text><rect x="234" y="130" width="208" height="112" rx="12" class="box"/><text x="250" y="160" class="label">L2</text><text x="250" y="191" class="heading">Collaborator</text><rect x="456" y="106" width="208" height="112" rx="12" class="box"/><text x="472" y="136" class="label">L3</text><text x="472" y="167" class="heading">Consultant</text><rect x="678" y="82" width="208" height="112" rx="12" class="focus"/><text x="694" y="112" class="label">L4</text><text x="694" y="143" class="heading">Approver</text><text x="694" y="176" class="text">Human signs off</text><rect x="900" y="58" width="208" height="112" rx="12" class="box"/><text x="916" y="88" class="label">L5</text><text x="916" y="119" class="heading">Observer</text><text x="916" y="152" class="text">Human watches</text><text x="782" y="291" class="text" text-anchor="middle">gh-aw: this deck’s interpretation</text><path d="M782 275 V232" class="line" marker-end="url(#arrow)"/></svg>
