<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 262" role="img" aria-labelledby="title desc"><title id="title">Only the last job holds a write token</title><desc id="desc">Simplified run: activation, agent, detection and safe outputs. A write-token row under the jobs shows the agent job has none, the detection job has none, and only the separate safe outputs job has a scoped write token. Only the proposed output is handed from job to job.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#ddf4ff;stroke:var(--blue);stroke-width:2}.write{fill:#dafbe1;stroke:var(--green);stroke-width:2}.warn{fill:#fff8c5;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono-h{fill:var(--hi);font:600 26px ui-monospace,SFMono-Regular,Consolas,monospace}.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wtext{fill:var(--warn);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.code{fill:var(--hi);font:20px ui-monospace,SFMono-Regular,Consolas,monospace}.cap{fill:var(--muted);font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.rule{fill:none;stroke:var(--line);stroke-width:1.5}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}.zone{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:5 6}
.chip{fill:#ffffff;stroke:var(--line);stroke-width:1.5}.none{fill:var(--muted);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.yes{fill:var(--green);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs>
<text x="1" y="24" class="label">READ / PREPARE</text>
<text x="883" y="24" class="label">PERMITTED WRITES</text>
<path d="M862 36 V232" class="boundary"/>
<rect x="1" y="48" width="252" height="108" rx="12" class="box"/>
<text x="21" y="82" class="heading">Activation</text>
<text x="21" y="112" class="text">Context checks</text>
<text x="21" y="140" class="text">Validate lock file</text>
<rect x="295" y="48" width="252" height="108" rx="12" class="focus"/>
<text x="315" y="82" class="heading">Agent</text>
<text x="315" y="112" class="text">Sandbox + firewall</text>
<text x="315" y="140" class="text">Drafts proposals</text>
<rect x="589" y="48" width="252" height="108" rx="12" class="box"/>
<text x="609" y="82" class="heading">Detection</text>
<text x="609" y="112" class="text">Scans proposals for</text>
<text x="609" y="140" class="text">injection and leaks</text>
<rect x="883" y="48" width="252" height="108" rx="12" class="write"/>
<text x="903" y="82" class="heading">Safe outputs</text>
<text x="903" y="112" class="text">Applies only the</text>
<text x="903" y="140" class="text">declared outputs</text>
<path d="M259 102 H294" class="line" marker-end="url(#arrow)"/>
<path d="M553 102 H588" class="line" marker-end="url(#arrow)"/>
<path d="M847 102 H882" class="line" marker-end="url(#arrow)"/>
<text x="21" y="203" class="label">WRITE TOKEN →</text>
<rect x="295" y="172" width="252" height="48" rx="24" class="chip"/>
<text x="421" y="203" class="none" text-anchor="middle">✗ none</text>
<rect x="589" y="172" width="252" height="48" rx="24" class="chip"/>
<text x="715" y="203" class="none" text-anchor="middle">✗ none</text>
<rect x="883" y="172" width="252" height="48" rx="24" class="write"/>
<text x="1009" y="203" class="yes" text-anchor="middle">✓ scoped, write</text>
<text x="568" y="256" class="cap" text-anchor="middle">Only the proposed output is handed on from job to job</text>
</svg>
