<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 266" role="img" aria-labelledby="title desc"><title id="title">Only the last job holds a write token</title><desc id="desc">Simplified run shown as four stacked jobs: get ready (activation), draft (agent), check (detection) and write (safe outputs). A padlock beside each shows the agent job and the detection job have no repository write token; only the separate safe outputs job has a scoped write token. Only the proposed output is handed from job to job. Detection is caution by default, not a block.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37;--blue-soft:#ddf4ff;--green-soft:#dafbe1;--warn-soft:#fff8c5;--white:#ffffff}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}.write{fill:var(--green-soft);stroke:var(--green);stroke-width:2}.warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.card{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.h{fill:var(--ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.t{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:var(--hi);font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.mt{fill:var(--hi);font:18px ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:var(--warn);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.g{fill:var(--green);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lab{fill:var(--hi);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 6}.ring{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.n{fill:var(--blue)}.nw{fill:var(--warn)}.ng{fill:var(--green)}.nt{fill:var(--white);font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker></defs>
<text x="2" y="16" class="lab">JOB</text><text x="318" y="16" class="lab">WRITE TOKEN</text>
<rect x="2" y="26" width="556" height="52" rx="12" class="box"/><text x="18" y="49" class="h">Get ready</text><text x="18" y="71" class="t">Activation</text>
<rect x="2" y="86" width="556" height="52" rx="12" class="focus"/><text x="18" y="109" class="h">Draft</text><text x="18" y="131" class="t">Agent: sandbox + firewall</text>
<rect x="316" y="92" width="234" height="40" rx="20" class="card"/><g transform="translate(340,103)" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linecap="round"><path d="M-7 0 V-7 a7 7 0 0 1 14 0 V0"/><rect x="-11" y="0" width="22" height="16" rx="3" fill="#59636e"/></g><text x="364" y="118" class="t" style="font-weight:600">no repo write token</text>
<rect x="2" y="146" width="556" height="52" rx="12" class="warn"/><text x="18" y="169" class="h">Check</text><text x="18" y="191" class="t">Detection: caution, not a block</text>
<rect x="316" y="152" width="234" height="40" rx="20" class="card"/><g transform="translate(340,163)" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linecap="round"><path d="M-7 0 V-7 a7 7 0 0 1 14 0 V0"/><rect x="-11" y="0" width="22" height="16" rx="3" fill="#59636e"/></g><text x="364" y="178" class="t" style="font-weight:600">no repo write token</text>
<rect x="2" y="206" width="556" height="52" rx="12" class="write"/><text x="18" y="229" class="h">Write</text><text x="18" y="251" class="t">Safe outputs: declared only</text>
<rect x="316" y="212" width="234" height="40" rx="20" class="card" style="stroke:var(--green)"/><g transform="translate(340,223)" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"><path d="M-7 0 V-7 a7 7 0 0 1 14 0 V0"/><rect x="-11" y="0" width="22" height="16" rx="3" fill="#1a7f37"/></g><text x="364" y="238" class="g" style="font-size:18px">scoped write token</text>
<path d="M200 78 V86" class="line" marker-end="url(#arrow)"/><path d="M200 138 V146" class="line" marker-end="url(#arrow)"/><path d="M200 198 V206" class="line" marker-end="url(#arrow)"/><circle cx="298" cy="112" r="14" class="n"/><text x="298" y="118" class="nt">1</text><circle cx="298" cy="232" r="14" class="ng"/><text x="298" y="238" class="nt">2</text>
</svg>
