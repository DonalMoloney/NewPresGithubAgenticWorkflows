<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 225" role="img" aria-labelledby="title desc"><title id="title">Author, compile, then run</title><desc id="desc">The Markdown file is transformed by gh aw compile into the generated lock YAML. Commit and review both files; GitHub Actions runs the YAML.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.write{fill:#132218;stroke:var(--green);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:1.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker></defs><rect x="12" y="30" width="280" height="107" rx="12" class="box"/><text x="32" y="66" class="label">AUTHOR</text><text x="32" y="104" class="code">update-docs.md</text><path d="M305 83 H493" class="line" marker-end="url(#arrow)"/><text x="398" y="57" class="code" text-anchor="middle">gh aw compile</text><rect x="510" y="30" width="316" height="107" rx="12" class="focus"/><text x="530" y="66" class="label">GENERATED</text><text x="530" y="104" class="code">update-docs.lock.yml</text><path d="M838 83 H877" class="line" marker-end="url(#arrow)"/><rect x="892" y="30" width="216" height="107" rx="12" class="box"/><text x="912" y="72" class="heading">GitHub Actions</text><text x="912" y="108" class="text">runs the YAML</text><path d="M30 151 V172 H806 V151" class="line"/><text x="418" y="207" class="text" text-anchor="middle">Commit and review both files</text></svg>
