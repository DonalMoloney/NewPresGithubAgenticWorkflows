<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 292" role="img" aria-labelledby="title desc"><title id="title">Hiring a teammate maps to the workflow file</title><desc id="desc">Four numbered pairs link a teammate badge to a workflow file. 1 Job description is the Markdown body. 2 Shift, when they work, is on. 3 Access badge, what they may touch, is permissions, tools and network. 4 Outbox you check is safe-outputs. This is the deck’s own model, not official GitHub terminology.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37;--blue-soft:#ddf4ff;--green-soft:#dafbe1;--warn-soft:#fff8c5;--white:#ffffff}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}.write{fill:var(--green-soft);stroke:var(--green);stroke-width:2}.warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.card{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.h{fill:var(--ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.t{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:var(--hi);font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.mt{fill:var(--hi);font:18px ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:var(--warn);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.g{fill:var(--green);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lab{fill:var(--hi);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 6}.ring{fill:var(--white);stroke:var(--line);stroke-width:1.5}
.n{fill:var(--blue)}.nw{fill:var(--warn)}.ng{fill:var(--green)}.nt{fill:var(--white);font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker></defs>
<text x="2" y="20" class="lab">THE TEAMMATE</text><text x="491" y="20" class="lab">THE WORKFLOW FILE</text>
<rect x="1" y="30" width="430" height="260" rx="12" class="card"/>
<path d="M491 42 a12 12 0 0 1 12 -12 H1087 L1135 78 V278 a12 12 0 0 1 -12 12 H503 a12 12 0 0 1 -12 -12 Z" class="card"/><path d="M1087 30 V66 a12 12 0 0 0 12 12 H1135" class="box"/>
<rect x="15" y="40" width="402" height="54" rx="8" class="box"/><circle cx="42" cy="67" r="13" class="n"/><text x="42" y="73" class="nt">1</text><text x="68" y="65" class="h" style="font-size:26px">Job description</text><text x="68" y="87" class="t" style="font-size:20px">what they are asked to do</text>
<path d="M417 67 H520" class="line" marker-end="url(#arrow)"/><rect x="522" y="40" width="566" height="54" rx="8" class="focus"/><circle cx="549" cy="67" r="13" class="n"/><text x="549" y="73" class="nt">1</text><text x="575" y="65" class="h" style="font-size:26px">Markdown body</text><text x="575" y="87" class="t" style="font-size:20px">plain-English instructions</text>
<rect x="15" y="103" width="402" height="54" rx="8" class="box"/><circle cx="42" cy="130" r="13" class="n"/><text x="42" y="136" class="nt">2</text><text x="68" y="128" class="h" style="font-size:26px">Shift</text><text x="68" y="150" class="t" style="font-size:20px">when they work</text>
<path d="M417 130 H520" class="line" marker-end="url(#arrow)"/><rect x="522" y="103" width="566" height="54" rx="8" class="focus"/><circle cx="549" cy="130" r="13" class="n"/><text x="549" y="136" class="nt">2</text><text x="575" y="128" class="m" style="font-size:26px">on:</text><text x="575" y="150" class="t" style="font-size:20px">when the workflow runs</text>
<rect x="15" y="166" width="402" height="54" rx="8" class="box"/><circle cx="42" cy="193" r="13" class="n"/><text x="42" y="199" class="nt">3</text><text x="68" y="191" class="h" style="font-size:26px">Access badge</text><text x="68" y="213" class="t" style="font-size:20px">what they may touch</text>
<path d="M417 193 H520" class="line" marker-end="url(#arrow)"/><rect x="522" y="166" width="566" height="54" rx="8" class="focus"/><circle cx="549" cy="193" r="13" class="n"/><text x="549" y="199" class="nt">3</text><text x="575" y="191" class="m" style="font-size:26px">permissions, tools, network</text><text x="575" y="213" class="t" style="font-size:20px">what it can read and reach</text>
<rect x="15" y="229" width="402" height="54" rx="8" class="box"/><circle cx="42" cy="256" r="13" class="n"/><text x="42" y="262" class="nt">4</text><text x="68" y="254" class="h" style="font-size:26px">Outbox you check</text><text x="68" y="276" class="t" style="font-size:20px">what they hand back</text>
<path d="M417 256 H520" class="line" marker-end="url(#arrow)"/><rect x="522" y="229" width="566" height="54" rx="8" class="focus"/><circle cx="549" cy="256" r="13" class="n"/><text x="549" y="262" class="nt">4</text><text x="575" y="254" class="m" style="font-size:26px">safe-outputs</text><text x="575" y="276" class="t" style="font-size:20px">approved writes, reviewed</text>
</svg>
