<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 432" role="img" aria-labelledby="title desc"><title id="title">A misled agent is boxed in by nested layers</title><desc id="desc">Three nested layers, numbered from the inside. 1, the container: opt-in tools and the agent, with no direct route out. 2, the gates out: a Squid proxy limited to an allowlist, an API proxy that keeps the engine auth token out of the agent container, and an MCP gateway the documentation itself calls a weak boundary. 3, outside: only what the workflow lists, namely allowlisted websites, the AI engine, and MCP servers reached through the gateway. A question mark on the listed websites marks the open question of whether an allowlisted domain can still receive data.</desc><style>
:root{--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#9a6700;--green:#1a7f37;--blue-soft:#ddf4ff;--green-soft:#dafbe1;--warn-soft:#fff8c5;--white:#ffffff}
.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.focus{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}.write{fill:var(--green-soft);stroke:var(--green);stroke-width:2}.warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.card{fill:var(--white);stroke:var(--line);stroke-width:2}
.h{fill:var(--ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.t{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:var(--hi);font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.mt{fill:var(--hi);font:18px ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:var(--warn);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.g{fill:var(--green);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lab{fill:var(--hi);font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 6}.ring{fill:var(--white);stroke:var(--line);stroke-width:2}
.n{fill:var(--blue)}.nw{fill:var(--warn)}.ng{fill:var(--green)}.nt{fill:var(--white);font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker></defs>
<rect x="1" y="1" width="698" height="430" rx="16" class="zone"/><circle cx="456" cy="24" r="13" class="n"/><text x="456" y="30" class="nt">3</text><text x="476" y="30" class="lab">ONLY WHAT WE LIST</text>
<rect x="14" y="44" width="476" height="376" rx="14" class="ring"/><circle cx="36" cy="67" r="13" class="n"/><text x="36" y="73" class="nt">2</text><text x="58" y="73" class="lab">GATES OUT</text>
<rect x="28" y="84" width="220" height="326" rx="12" class="focus"/><circle cx="50" cy="107" r="13" class="n"/><text x="50" y="113" class="nt">1</text><text x="72" y="113" class="lab">CONTAINER</text>
<rect x="42" y="124" width="192" height="94" rx="12" class="card"/><text x="56" y="152" class="h">Tools: opt-in</text><text x="56" y="176" class="t">bash limited to</text><text x="56" y="200" class="mt">gh issue comment</text>
<path d="M138 218 V240" class="line" marker-end="url(#arrow)"/><rect x="42" y="242" width="192" height="66" rx="12" class="card" style="stroke:var(--blue)"/><text x="56" y="270" class="h">Agent</text><text x="56" y="294" class="t">reads, plans, drafts</text>
<text x="42" y="350" class="t">No direct route out:</text><text x="42" y="374" class="t">every call uses a gate</text>
<path d="M248 142 H264" class="line" marker-end="url(#arrow)"/><rect x="266" y="98" width="204" height="88" rx="12" class="box"/><text x="280" y="127" class="h">Squid proxy</text><text x="280" y="152" class="t">domain allowlist</text><text x="280" y="174" class="t">all else blocked</text>
<path d="M470 142 H504" class="line" marker-end="url(#arrow)"/><rect x="506" y="98" width="178" height="88" rx="12" class="box"/><text x="518" y="127" class="h" style="font-size:20px">Listed websites</text><text x="518" y="154" class="mt">network:</text><text x="518" y="178" class="mt">defaults</text>
<path d="M248 242 H264" class="line" marker-end="url(#arrow)"/><rect x="266" y="198" width="204" height="88" rx="12" class="box"/><text x="280" y="227" class="h">API proxy</text><text x="280" y="252" class="t">keeps engine token</text><text x="280" y="274" class="t">out of container</text>
<path d="M470 242 H504" class="line" marker-end="url(#arrow)"/><rect x="506" y="198" width="178" height="88" rx="12" class="box"/><text x="518" y="227" class="h" style="font-size:20px">AI engine</text><text x="518" y="254" class="t">token stays here</text>
<path d="M248 342 H264" class="wline" marker-end="url(#warrow)"/><rect x="266" y="298" width="204" height="88" rx="12" class="warn"/><text x="280" y="327" class="h">MCP gateway</text><text x="280" y="352" class="w">a weak boundary,</text><text x="280" y="374" class="w">per the docs</text>
<path d="M470 342 H504" class="wline" marker-end="url(#warrow)"/><rect x="506" y="298" width="178" height="88" rx="12" class="box"/><text x="518" y="327" class="h" style="font-size:20px">MCP servers</text><text x="518" y="354" class="t">via the gateway</text>
<circle cx="664" cy="164" r="13" style="fill:var(--warn)"/><text x="664" y="170" class="nt">?</text>

</svg>
