<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 392" role="img" aria-labelledby="title desc"><title id="title">A misled agent can only reach what is allowlisted</title><desc id="desc">The agent sits in a container with opt-in tools. All outbound traffic leaves through gates: a Squid proxy that allows only listed domains, an API proxy that keeps the engine token out of the container, and an MCP gateway to MCP servers. The MCP gateway is drawn dashed and orange because the docs say it is not a strong security boundary on its own, so defence comes from layers.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wtext{fill:var(--warn);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:20px ui-monospace,SFMono-Regular,Consolas,monospace}.line{fill:none;stroke:var(--blue);stroke-width:2}.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}.zone{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker><marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e9a35c"/></marker></defs>
<text x="18" y="25" class="label">INSIDE THE CONTAINER</text><text x="358" y="25" class="label">GATES OUT</text><text x="746" y="25" class="label">OUTSIDE</text>
<rect x="12" y="40" width="300" height="344" rx="12" class="zone"/>
<rect x="32" y="54" width="260" height="90" rx="12" class="box"/><text x="52" y="88" class="heading">Tools: opt-in</text><text x="52" y="116" class="text">bash can be limited</text><text x="52" y="136" class="code" font-size="18">to one command</text>
<path d="M162 144 V168" class="line"/>
<rect x="32" y="168" width="260" height="90" rx="12" class="focus"/><text x="52" y="206" class="heading">Agent</text><text x="52" y="238" class="text">Reads, plans, drafts</text>
<text x="32" y="316" class="text">No direct route out:</text><text x="32" y="342" class="text">every call uses a gate</text>
<path d="M292 213 H332 M332 99 V327" class="line"/><path d="M332 99 H350" class="line" marker-end="url(#arrow)"/><path d="M332 213 H350" class="line" marker-end="url(#arrow)"/><path d="M332 327 H350" class="wline" marker-end="url(#warrow)"/>
<rect x="352" y="54" width="310" height="90" rx="12" class="focus"/><text x="372" y="88" class="heading">Squid proxy</text><text x="372" y="114" class="text">Egress domain allowlist</text><text x="372" y="136" class="text">All else blocked</text>
<rect x="352" y="168" width="310" height="90" rx="12" class="box"/><text x="372" y="202" class="heading">API proxy</text><text x="372" y="228" class="text">Keeps the engine token</text><text x="372" y="250" class="text">out of the container</text>
<rect x="352" y="282" width="310" height="102" rx="12" class="warn"/><text x="372" y="316" class="heading">MCP gateway</text><text x="372" y="342" class="wtext">Not a strong boundary</text><text x="372" y="366" class="text">Defence = layers</text>
<path d="M662 99 H736" class="line" marker-end="url(#arrow)"/><path d="M662 213 H736" class="line" marker-end="url(#arrow)"/><path d="M662 333 H736" class="wline" marker-end="url(#warrow)"/>
<rect x="740" y="54" width="384" height="90" rx="12" class="box"/><text x="760" y="88" class="heading">Allowlisted domains</text><text x="760" y="116" class="code">network: defaults</text><text x="760" y="136" class="text">network: {} = no access</text>
<rect x="740" y="168" width="384" height="90" rx="12" class="box"/><text x="760" y="202" class="heading">AI engine</text><text x="760" y="234" class="text">Token stays out here</text>
<rect x="740" y="282" width="384" height="102" rx="12" class="box"/><text x="760" y="316" class="heading">MCP servers</text><text x="760" y="346" class="text">Reached via the gateway</text>
</svg>
