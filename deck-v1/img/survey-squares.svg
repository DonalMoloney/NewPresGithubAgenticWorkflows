<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" role="img" aria-labelledby="title desc"><title id="title">56.5 of every 100 developers named outdated information</title><desc id="desc">Grid of 100 squares, each about 1 percent of 12,374 survey respondents. 56 squares are filled and one is half filled: 6,989 respondents named outdated information; 5,385 did not.</desc><style>
