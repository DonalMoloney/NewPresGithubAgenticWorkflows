<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc"><title id="title">Three gates the pilot result must pass</title><desc id="desc">Three gates in a row, each with its own shape. Gate 1, a circle with a tick: Accepted, a reviewer agreed the problem was real, threshold still a TODO. Gate 2, a downward triangle: Less effort, total effort below the manual baseline, baseline still a TODO. Gate 3, a flat-topped cap: Within budget, spend inside the caps we set, budget still a TODO. Proposed criteria, not an agreed plan.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:3}.sq{fill:var(--accent)}.sqo{fill:none;stroke:var(--line);stroke-width:2}.sqg{fill:var(--hairline)}.gap{fill:var(--chip);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
.heading{fill:var(--ink);font:650 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tech{fill:var(--accent-ink);font:19px ui-monospace,SFMono-Regular,Consolas,monospace}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.big{fill:var(--ink);font:650 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.badge{fill:var(--accent-ink)}.bn{fill:#fff;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.line{fill:none;stroke:var(--muted);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 6}.ic{fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs>
<rect x="1" y="1" width="338" height="248" rx="12" class="focus" style="fill:var(--panel)"/><circle cx="34" cy="38" r="16" class="badge"/><text x="34" y="45" class="bn">1</text><text x="60" y="45" class="label">GATE 1</text>
<circle cx="290" cy="38" r="22" class="ic"/><path d="M280 38 l7 8 l13 -16" class="ic"/>
<text x="22" y="100" class="heading">Accepted</text><text x="22" y="140" class="text">A reviewer agreed the</text><text x="22" y="170" class="text">problem was real.</text>
<rect x="22" y="196" width="188" height="38" rx="8" class="gap"/><text x="116.0" y="222" class="big" text-anchor="middle" style="font-size:20px">threshold TODO</text>
<path d="M346 125 H384" class="line" marker-end="url(#arrow)"/>
<rect x="391" y="1" width="338" height="248" rx="12" class="focus" style="fill:var(--panel)"/><circle cx="424" cy="38" r="16" class="badge"/><text x="424" y="45" class="bn">2</text><text x="450" y="45" class="label">GATE 2</text>
<path d="M658 22 H702 L680 54 Z" class="ic"/>
<text x="412" y="100" class="heading">Less effort</text><text x="412" y="140" class="text">Total effort below the</text><text x="412" y="170" class="text">manual baseline.</text>
<rect x="412" y="196" width="177" height="38" rx="8" class="gap"/><text x="500.5" y="222" class="big" text-anchor="middle" style="font-size:20px">baseline TODO</text>
<path d="M736 125 H774" class="line" marker-end="url(#arrow)"/>
<rect x="781" y="1" width="338" height="248" rx="12" class="focus" style="fill:var(--panel)"/><circle cx="814" cy="38" r="16" class="badge"/><text x="814" y="45" class="bn">3</text><text x="840" y="45" class="label">GATE 3</text>
<path d="M1046 20 H1094 M1070 30 V54 M1060 44 L1070 54 L1080 44" class="ic"/>
<text x="802" y="100" class="heading">Within budget</text><text x="802" y="140" class="text">Spend inside the</text><text x="802" y="170" class="text">caps we set.</text>
<rect x="802" y="196" width="155" height="38" rx="8" class="gap"/><text x="879.5" y="222" class="big" text-anchor="middle" style="font-size:20px">budget TODO</text>
</svg>