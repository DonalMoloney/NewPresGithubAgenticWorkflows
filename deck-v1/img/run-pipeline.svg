<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc"><title id="title">Separate jobs, separate permissions</title><desc id="desc">Simplified run: prepare, agent, detection and safe outputs. The agent and detector have read-only access; the separate output job has scoped write permissions.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.write{fill:#132218;stroke:var(--green);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:1.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker></defs><text x="18" y="25" class="label">READ / PREPARE</text><text x="868" y="25" class="label">PERMITTED WRITES</text><path d="M836 44 V230" class="boundary"/><rect x="12" y="55" width="244" height="140" rx="12" class="box"/><text x="32" y="96" class="heading">Prepare</text><text x="32" y="135" class="text">Context checks</text><text x="32" y="167" class="text">Validate lock file</text><path d="M262 125 H276" class="line" marker-end="url(#arrow)"/><rect x="288" y="55" width="244" height="140" rx="12" class="focus"/><text x="308" y="96" class="heading">Agent</text><text x="308" y="135" class="text">Sandbox + firewall</text><text x="308" y="167" class="text">Read-only access</text><path d="M538 125 H552" class="line" marker-end="url(#arrow)"/><rect x="564" y="55" width="244" height="140" rx="12" class="box"/><text x="584" y="96" class="heading">Detection</text><text x="584" y="135" class="text">Inspect output</text><text x="584" y="167" class="text">and patch</text><path d="M814 125 H852" class="line" marker-end="url(#arrow)"/><rect x="864" y="55" width="244" height="140" rx="12" class="write"/><text x="884" y="96" class="heading">Safe outputs</text><text x="884" y="135" class="text">Scoped write access</text><text x="884" y="167" class="text">Declared outputs</text><path d="M24 208 V227 H796 V208" class="line"/><text x="410" y="261" class="text" text-anchor="middle">Agent and detection have no write access</text><text x="986" y="261" class="text" text-anchor="middle">Separate write job</text></svg>
