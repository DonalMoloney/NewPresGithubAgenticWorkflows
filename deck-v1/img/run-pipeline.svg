<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Separate jobs, separate permissions</title><desc id="desc">Simplified run in four numbered stages: prepare, agent, detection and safe outputs. Four of the six documented jobs are shown. The agent and detection jobs are read-only: the agent has read-only repository and API permissions and detection has no write permissions. Stage 4 is a separate job with scoped write permissions, set apart by a dashed boundary.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:2}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:3}.sq{fill:var(--accent)}.sqo{fill:none;stroke:var(--line);stroke-width:2}.sqg{fill:var(--hairline)}.gap{fill:var(--chip);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
.heading{fill:var(--ink);font:650 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tech{fill:var(--accent-ink);font:19px ui-monospace,SFMono-Regular,Consolas,monospace}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.big{fill:var(--ink);font:650 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:var(--muted);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.badge{fill:var(--accent-ink)}.bn{fill:#fff;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.line{fill:none;stroke:var(--muted);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 6}.ic{fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs>
<text x="12" y="26" class="label">SIMPLIFIED RUN</text><text x="300" y="26" class="small">4 of 6 documented jobs shown</text><text x="876" y="26" class="label">THE ONLY WRITE STAGE</text>
<path d="M818 44 V98 M818 150 V236" class="boundary"/>
<rect x="12" y="50" width="224" height="170" rx="12" class="box"/><circle cx="40" cy="82" r="16" class="badge"/><text x="40" y="89" class="bn">1</text><text x="66" y="91" class="heading">Gets ready</text><text x="32" y="128" class="tech">Prepare</text><text x="32" y="165" class="text">Role + permissions</text><text x="32" y="195" class="text">Validate lock file</text>
<path d="M240 135 H278" class="line" marker-end="url(#arrow)"/>
<rect x="274" y="50" width="224" height="170" rx="12" class="focus"/><circle cx="302" cy="82" r="16" class="badge"/><text x="302" y="89" class="bn">2</text><text x="328" y="91" class="heading">Thinks</text><text x="294" y="128" class="tech">Agent</text><text x="294" y="165" class="text">Container + allowlist</text><text x="294" y="195" class="text">Read-only repo + API</text>
<path d="M502 135 H540" class="line" marker-end="url(#arrow)"/>
<rect x="536" y="50" width="224" height="170" rx="12" class="box"/><circle cx="564" cy="82" r="16" class="badge"/><text x="564" y="89" class="bn">3</text><text x="590" y="91" class="heading">Checks</text><text x="556" y="128" class="tech">Detection</text><text x="556" y="165" class="text">Inspect output</text><text x="556" y="195" class="text">and patch</text>
<text x="814" y="118" class="small" text-anchor="middle">if permitted</text><path d="M766 135 H868" class="line" marker-end="url(#arrow)"/>
<rect x="876" y="50" width="232" height="170" rx="12" class="write"/><circle cx="904" cy="82" r="16" class="badge"/><text x="904" y="89" class="bn">4</text><text x="930" y="91" class="heading">Hands it in</text><text x="896" y="128" class="tech">Safe outputs</text><text x="896" y="165" class="text">Scoped write access</text><text x="896" y="195" class="text">Declared outputs</text>
<path d="M274 238 V252 H760 V238" class="line"/><text x="517" y="282" class="big" text-anchor="middle">Agent and detection jobs are read-only</text><text x="992" y="282" class="big" text-anchor="middle">Separate write job</text></svg>