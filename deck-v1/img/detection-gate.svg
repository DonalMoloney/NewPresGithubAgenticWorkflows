<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 358" role="img" aria-labelledby="title desc"><title id="title">Detection outcomes and the write decision</title><desc id="desc">Threat, warning or failed check, and permitted-output branches. Failure behaviour must be verified with explicit settings; the diagram does not guarantee blocking.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.write{fill:#132218;stroke:var(--green);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:1.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker></defs><text x="12" y="24" class="label">DETECTION OUTCOMES · SIMPLIFIED</text><rect x="12" y="134" width="235" height="100" rx="12" class="focus"/><text x="36" y="176" class="heading">Detection</text><text x="36" y="209" class="text">Output + patch</text><path d="M247 184 H295 V93 H345" class="line" marker-end="url(#arrow)"/><rect x="360" y="50" width="746" height="86" rx="12" class="warn"/><text x="384" y="84" class="heading">Threat detected</text><text x="384" y="115" class="text">Docs describe blocking; verify settings</text><path d="M247 184 H295 V198 H345" class="line" marker-end="url(#arrow)"/><rect x="360" y="155" width="746" height="86" rx="12" class="warn"/><text x="384" y="189" class="heading">Warning / failed check</text><text x="384" y="220" class="text">Review warnings; test failure behaviour</text><path d="M247 184 H295 V303 H345" class="line" marker-end="url(#arrow)"/><rect x="360" y="260" width="746" height="86" rx="12" class="write"/><text x="384" y="294" class="heading">Permitted output</text><text x="384" y="325" class="text">Separate job applies the allowed write</text></svg>
