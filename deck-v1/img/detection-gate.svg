<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 358" role="img" aria-labelledby="title desc"><title id="title">Detection outcomes and the write decision</title><desc id="desc">Threat, warning or failed check, and permitted-output branches. Failure behaviour must be verified with explicit settings; the diagram does not guarantee blocking.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:2.5}.warn{fill:var(--caution-tint);stroke:var(--caution);stroke-width:1.5;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--accent-ink);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--accent-ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--muted);stroke-width:2}.small{fill:var(--muted);font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boundary{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs><text x="12" y="26" class="label">DETECTION OUTCOMES · SIMPLIFIED</text><rect x="12" y="134" width="235" height="100" rx="12" class="focus"/><text x="32" y="176" class="heading">Detection</text><text x="32" y="209" class="text">Output + patch</text><text x="12" y="266" class="small">Its own job, with no</text><text x="12" y="288" class="small">write permissions</text><path d="M247 184 H295 V93 H348" class="line" marker-end="url(#arrow)"/><rect x="360" y="50" width="746" height="86" rx="12" class="warn"/><text x="380" y="84" class="heading">Threat detected</text><text x="380" y="115" class="text">Docs describe blocking; verify settings</text><path d="M247 184 H295 V198 H348" class="line" marker-end="url(#arrow)"/><rect x="360" y="155" width="746" height="86" rx="12" class="warn"/><text x="380" y="189" class="heading">Warning / failed check</text><text x="380" y="220" class="text">Review warnings; test failure behaviour</text><text x="1086" y="220" class="small" text-anchor="end">default: continue-on-error: true</text><path d="M247 184 H295 V303 H348" class="line" marker-end="url(#arrow)"/><rect x="360" y="260" width="746" height="86" rx="12" class="write"/><text x="380" y="294" class="heading">Permitted output</text><text x="380" y="325" class="text">Separate job applies the allowed write</text></svg>
