<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc"><title id="title">Documentation debt builds up between doc passes</title><desc id="desc">Illustrative chart with no data. Over time the code line rises in eight steps, one per shipped change. The docs line stays flat and rises at only two doc passes, and each pass closes only part of the gap. The shaded gap between them is documentation debt: it never returns to zero and keeps growing between passes.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:2.5}.warn{fill:var(--caution-tint);stroke:var(--caution);stroke-width:1.5;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--accent-ink);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--accent-ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--muted);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
.axis{fill:none;stroke:var(--line);stroke-width:2}.small{fill:var(--muted);font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.codeline{fill:none;stroke:var(--accent);stroke-width:3}.docsline{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:9 7}.debt{fill:url(#hatch)}.debt-t{fill:var(--caution);font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.series{font:600 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pass{fill:var(--ink)}
</style><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#8f4a0f" stroke-width="1.4" stroke-opacity=".55"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs>
<text x="12" y="26" class="label">ILLUSTRATIVE · NO DATA</text>
<path d="M125 250 V226 H230 V202 H335 V178 H440 V154 H545 V130 H650 V106 H755 V82 H860 V58 H960 V134 H700 V188 H490 V250 Z" class="debt"/>
<path d="M70 270 H1040" class="axis"/><path d="M70 270 V50" class="axis"/>
<text x="46" y="160" class="small" text-anchor="middle" transform="rotate(-90 46 160)">cumulative changes</text>
<text x="1102" y="297" class="small" text-anchor="end">time (no scale) →</text>
<path d="M70 250 H125 V226 H230 V202 H335 V178 H440 V154 H545 V130 H650 V106 H755 V82 H860 V58 H960" class="codeline"/>
<path d="M70 250 H490 V188 H700 V134 H960" class="docsline"/>
<circle cx="490" cy="188" r="6" class="pass"/><circle cx="700" cy="134" r="6" class="pass"/>
<text x="502" y="214" class="small">doc pass</text><text x="712" y="160" class="small">doc pass</text>
<text x="975" y="65" class="series" fill="#5a6470" style="fill:var(--accent)">Code</text><text x="975" y="86" class="small">shipped</text><text x="975" y="141" class="series" style="fill:var(--muted)">Docs</text><text x="975" y="162" class="small">documented</text>
<text x="950" y="110" class="debt-t" text-anchor="end">documentation debt</text>
</svg>
