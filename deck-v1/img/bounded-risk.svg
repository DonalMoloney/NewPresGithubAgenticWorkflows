<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">The pilot's risk is boxed in on five sides</title><desc id="desc">Six nested boxes. From outside in: four weeks, then continue, change or stop; capped spend, limits TODO; one repo, one owner, TODO; docs only, update-docs.md; draft pull requests only. At the centre: a person decides what merges.</desc><style>
:root{--panel:#f6f8fa;--line:#6e7781;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--hi:#0550ae;--warn:#bc4c00;--green:#1a7f37}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.r1{fill:#fcfdfe}.r2{fill:#f7f9fb}.r3{fill:#f2f5f8}.r4{fill:#edf1f5}.r5{fill:#e8edf2}.focus{fill:#ddf4ff;stroke:var(--blue);stroke-width:2}.write{fill:#dafbe1;stroke:var(--green);stroke-width:1.5}.warn{fill:#fff1e5;stroke:var(--warn);stroke-width:1.5;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker></defs><rect x="10" y="10" width="1100" height="360" rx="12" class="box r1"/><text x="30" y="40" class="label">FOUR WEEKS · THEN CONTINUE, CHANGE OR STOP</text><rect x="76" y="58" width="968" height="302" rx="12" class="box r2"/><text x="96" y="88" class="label">CAPPED SPEND · LIMITS <tspan style="fill:var(--warn)">TODO</tspan></text><rect x="142" y="106" width="836" height="244" rx="12" class="box r3"/><text x="162" y="136" class="label">ONE REPO, ONE OWNER · <tspan style="fill:var(--warn)">TODO</tspan></text><rect x="208" y="154" width="704" height="186" rx="12" class="box r4"/><text x="228" y="184" class="label">DOCS ONLY · update-docs.md</text><rect x="274" y="202" width="572" height="128" rx="12" class="box r5"/><text x="294" y="232" class="label">DRAFT PULL REQUESTS ONLY</text><rect x="340" y="250" width="440" height="70" rx="12" class="focus"/><text x="560" y="294" class="heading" text-anchor="middle">A person decides what merges</text></svg>
