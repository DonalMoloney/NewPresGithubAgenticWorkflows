<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 306" role="img" aria-labelledby="title desc"><title id="title">Four-week pilot with a decision at the end</title><desc id="desc">Week one review scope and staged preview; week two draft PRs with human review; week three measure cost and effort; week four continue, change or stop.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:2.5}.warn{fill:var(--caution-tint);stroke:var(--caution);stroke-width:1.5;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--accent-ink);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--accent-ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--muted);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs><text x="12" y="26" class="label">PROPOSED FOUR-WEEK PILOT</text><text x="1108" y="26" class="label" text-anchor="end">DECISION GATE →</text><path d="M134 73 H960" class="line" marker-end="url(#arrow)"/><circle cx="134" cy="73" r="23" class="box"/><text x="134" y="81" class="num" text-anchor="middle">1</text><rect x="12" y="115" width="244" height="131" rx="12" class="box"/><text x="32" y="153" class="heading">Review</text><text x="32" y="191" class="text">Scope +</text><text x="32" y="220" class="text">staged preview</text><circle cx="414" cy="73" r="23" class="box"/><text x="414" y="81" class="num" text-anchor="middle">2</text><rect x="292" y="115" width="244" height="131" rx="12" class="box"/><text x="312" y="153" class="heading">Try</text><text x="312" y="191" class="text">Draft PRs</text><text x="312" y="220" class="text">Human review</text><circle cx="694" cy="73" r="23" class="box"/><text x="694" y="81" class="num" text-anchor="middle">3</text><rect x="572" y="115" width="244" height="131" rx="12" class="box"/><text x="592" y="153" class="heading">Measure</text><text x="592" y="191" class="text">Cost + effort</text><text x="592" y="220" class="text">per accepted change</text><circle cx="974" cy="73" r="23" class="focus"/><text x="974" y="81" class="num" text-anchor="middle">4</text><rect x="852" y="115" width="244" height="131" rx="12" class="focus"/><text x="872" y="153" class="heading">Decide</text><text x="872" y="191" class="text">Continue, change</text><text x="872" y="220" class="text">or stop</text><text x="560" y="286" class="text" text-anchor="middle">Agree the baseline and success criteria before week one</text></svg>
