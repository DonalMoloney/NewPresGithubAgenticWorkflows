<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 306" role="img" aria-labelledby="title desc"><title id="title">Four-week pilot with a decision at the end</title><desc id="desc">Week one review; week two draft PRs with human review; week three measure cost and effort; week four continue, change or stop.</desc><style>
:root{--panel:#141414;--line:#343c49;--ink:#ececec;--muted:#a3a3a3;--blue:#8fb0dc;--hi:#b9d0ee;--warn:#e9a35c;--green:#85c58a}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:#101b29;stroke:var(--blue);stroke-width:2}.write{fill:#132218;stroke:var(--green);stroke-width:2}.warn{fill:#241b12;stroke:var(--warn);stroke-width:1.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--hi);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--hi);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.num{fill:var(--hi);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--blue);stroke-width:2}.boundary{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fb0dc"/></marker></defs><text x="12" y="25" class="label">PROPOSED FOUR-WEEK PILOT</text><path d="M134 73 H986" class="line"/><circle cx="134" cy="73" r="23" class="focus"/><text x="134" y="81" class="num" text-anchor="middle">1</text><rect x="12" y="115" width="244" height="131" rx="12" class="box"/><text x="32" y="153" class="heading">Review</text><text x="32" y="191" class="text">Scope + preview</text><circle cx="414" cy="73" r="23" class="focus"/><text x="414" y="81" class="num" text-anchor="middle">2</text><rect x="292" y="115" width="244" height="131" rx="12" class="box"/><text x="312" y="153" class="heading">Try</text><text x="312" y="191" class="text">Draft PRs</text><text x="312" y="220" class="text">Human review</text><circle cx="694" cy="73" r="23" class="focus"/><text x="694" y="81" class="num" text-anchor="middle">3</text><rect x="572" y="115" width="244" height="131" rx="12" class="box"/><text x="592" y="153" class="heading">Measure</text><text x="592" y="191" class="text">Cost + effort</text><circle cx="974" cy="73" r="23" class="focus"/><text x="974" y="81" class="num" text-anchor="middle">4</text><rect x="852" y="115" width="244" height="131" rx="12" class="write"/><text x="872" y="153" class="heading">Decide</text><text x="872" y="191" class="text">Continue, change</text><text x="872" y="220" class="text">or stop</text><text x="560" y="286" class="text" text-anchor="middle">Agree the baseline and success criteria before week one.</text></svg>
