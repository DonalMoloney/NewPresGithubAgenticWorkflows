<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 356" role="img" aria-labelledby="title desc"><title id="title">Agents add a third lane beside CI and CD</title><desc id="desc">Three lanes: CI builds it (build, test) and CD ships it (release, deploy), both predictable scripted steps. Continuous AI, improving your repo around the clock (docs, triage, tests, fixes), uses judgement and a person reviews the result.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:2.5}.warn{fill:var(--caution-tint);stroke:var(--caution);stroke-width:1.5;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.code{fill:var(--accent-ink);font:21px ui-monospace,SFMono-Regular,Consolas,monospace}.out{fill:var(--ink);font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.num{fill:var(--accent-ink);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--muted);stroke-width:2}.boundary{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 6}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs><text x="12" y="26" class="label">THREE LANES · gh-aw FRAMING</text><rect x="12" y="45" width="344" height="185" rx="12" class="box"/><text x="32" y="88" class="heading">CI</text><text x="32" y="124" class="label">BUILDS IT</text><text x="32" y="184" class="text">build · test</text><text x="32" y="214" class="out">→ pass or fail</text><rect x="388" y="45" width="344" height="185" rx="12" class="box"/><text x="408" y="88" class="heading">CD</text><text x="408" y="124" class="label">SHIPS IT</text><text x="408" y="184" class="text">release · deploy</text><text x="408" y="214" class="out">→ a deployment</text><rect x="764" y="45" width="344" height="185" rx="12" class="focus"/><text x="784" y="88" class="heading">Continuous AI</text><text x="784" y="124" class="label">IMPROVING YOUR REPO,</text><text x="784" y="150" class="label">AROUND THE CLOCK</text><text x="784" y="184" class="text">docs · triage · tests · fixes</text><text x="784" y="214" class="out">→ a draft PR you review</text><path d="M24 244 V263 H720 V244" class="line"/><text x="372" y="300" class="text" text-anchor="middle">Predictable: scripted steps</text><path d="M776 244 V263 H1096 V244" class="line"/><text x="936" y="300" class="text" text-anchor="middle">Judgement: needs interpretation</text><text x="560" y="344" class="text" text-anchor="middle">Continuous AI adds a lane; it does not replace CI or CD.</text></svg>
