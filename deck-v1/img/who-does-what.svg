<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc"><title id="title">The agent proposes, a person decides</title><desc id="desc">The agent reads the repository, drafts the change and opens a draft pull request. That draft passes to a person, who owns the workflow file, reviews the diff and decides what merges. The person has two outcomes: merge it or close it. Both outcomes are the system working as intended.</desc><style>
:root{--panel:#f5f7f9;--chip:#eceff3;--hairline:#d9dee4;--line:#6b7580;--ink:#14181d;--muted:#5a6470;--accent:#0b5cd4;--accent-ink:#0a3f8f;--accent-tint:#e7f0fd;--caution:#8f4a0f;--caution-tint:#fbf0e6}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focus{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.write{fill:var(--accent-tint);stroke:var(--accent-ink);stroke-width:2.5}
.heading{fill:var(--ink);font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:var(--muted);font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.small{fill:var(--muted);font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{fill:none;stroke:var(--muted);stroke-width:2}
</style><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a6470"/></marker></defs>
<text x="12" y="22" class="label">THE AGENT PROPOSES</text><text x="432" y="22" class="label">A PERSON DECIDES</text>
<rect x="12" y="44" width="340" height="150" rx="12" class="box"/><text x="32" y="82" class="heading">The agent</text><text x="32" y="118" class="text">Reads the repository</text><text x="32" y="148" class="text">Drafts the change</text><text x="32" y="178" class="text">Opens a draft PR</text>
<path d="M356 119 H424" class="line" marker-end="url(#a2)"/><text x="390" y="102" class="small" text-anchor="middle">draft PR</text>
<rect x="432" y="44" width="340" height="150" rx="12" class="focus"/><text x="452" y="82" class="heading">A person</text><text x="452" y="118" class="text">Owns the workflow file</text><text x="452" y="148" class="text">Reviews the diff</text><text x="452" y="178" class="text">Decides what merges</text>
<path d="M776 119 H844" class="line" marker-end="url(#a2)"/><text x="810" y="102" class="small" text-anchor="middle">decides</text>
<rect x="852" y="44" width="256" height="66" rx="12" class="write"/><text x="872" y="86" class="heading">Merges it</text>
<rect x="852" y="128" width="256" height="66" rx="12" class="box"/><text x="872" y="170" class="heading">Closes it</text>
<text x="12" y="232" class="small">The agent holds no merge decision at any point</text>
<text x="1108" y="232" class="small" text-anchor="end">Both outcomes are the system working</text>
</svg>
