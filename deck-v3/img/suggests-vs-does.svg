<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 322" role="img" aria-labelledby="title desc"><title id="title">An assistant waits to be asked; a workflow runs when a trigger fires</title><desc id="desc">Illustrative, not measured data, and this deck's own framing. Two tracks span the same stretch of time, with three periods when a person is at the keyboard shaded on both. On the top track, an assistant you ask, work happens only inside those periods: the person asks and gets a reply at once, and the gaps between them are empty, so nothing runs. On the bottom track, a workflow with a trigger, a clock or event starts runs inside the periods and also in the gaps. Output from the gap runs arrows forward into a review queue inside the next period at the keyboard, so the person moves from asking to reviewing. The only axis shown is who starts the work and where the output lands.</desc>
<style>
:root{--bg:#050507;--panel:#141414;--line:#3b2f33;--ink:#ececec;--muted:#a3a3a3;--accent:#d94a4a;--hi:#ff8a8a;--good:#85c58a;--warn:#e9a35c;--fill-accent:#2a1115;--fill-good:#13221a;--fill-warn:#241b12}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.focus{fill:var(--fill-accent);stroke:var(--accent);stroke-width:2}
.write{fill:var(--fill-good);stroke:var(--good);stroke-width:2.5}
.warn{fill:var(--fill-warn);stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}
.heading{fill:var(--ink);font:600 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.mono-h{fill:var(--hi);font:600 26px ui-monospace,SFMono-Regular,Consolas,monospace}
.text{fill:var(--muted);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.itext{fill:var(--ink);font:22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wtext{fill:var(--warn);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.gtext{fill:var(--good);font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.code{fill:var(--hi);font:20px ui-monospace,SFMono-Regular,Consolas,monospace}
.cap{fill:var(--muted);font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.label{fill:var(--hi);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.glabel{fill:var(--good);font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
.line{fill:none;stroke:var(--accent);stroke-width:2}
.wline{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:7 5}
.gline{fill:none;stroke:var(--good);stroke-width:2}
.rule{fill:none;stroke:var(--line);stroke-width:1.5}
.boundary{fill:none;stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 6}
.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 6}
.seal{fill:none;stroke:var(--accent);stroke-width:2}
.i-accent{color:var(--accent)}.i-hi{color:var(--hi)}.i-warn{color:var(--warn)}
.i-good{color:var(--good)}.i-muted{color:var(--muted)}.i-ink{color:var(--ink)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d94a4a"/></marker>
<marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e9a35c"/></marker>
<marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#85c58a"/></marker>
<symbol id="g-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.2"/><path d="M11 11l8.5 8.5M16 16l2.5-2.5M18.5 18.5l2-2"/></g></symbol>
<symbol id="g-nokey" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"><circle cx="8" cy="8" r="4.2"/><path d="M11 11l8.5 8.5M16 16l2.5-2.5"/></g><path d="M2.5 21.5L21.5 2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="g-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></g></symbol>
<symbol id="g-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 22.2 20.6H1.8Z"/><path d="M12 9v5"/></g><circle cx="12" cy="17.4" r="1.25" fill="currentColor"/></symbol>
<symbol id="g-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="10.5" width="17" height="11" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></g></symbol>
<symbol id="g-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.4l3.2 3.2 6-6.4"/></g></symbol>
<symbol id="g-person" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M3.8 21c0-4.5 3.7-7.2 8.2-7.2S20.2 16.5 20.2 21"/></g></symbol>
<symbol id="g-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.6V12l4 2.4"/></g></symbol>
</defs>
<rect x="250" y="40" width="170" height="232" rx="12" class="zone" style="fill:var(--fill-accent)"/>
<use href="#g-person" x="260" y="48" width="28" height="28" class="i-hi"/><text x="296" y="70" class="cap">at keyboard</text>
<rect x="600" y="40" width="170" height="232" rx="12" class="zone" style="fill:var(--fill-accent)"/>
<use href="#g-person" x="610" y="48" width="28" height="28" class="i-hi"/><text x="646" y="70" class="cap">at keyboard</text>
<rect x="950" y="40" width="170" height="232" rx="12" class="zone" style="fill:var(--fill-accent)"/>
<use href="#g-person" x="960" y="48" width="28" height="28" class="i-hi"/><text x="996" y="70" class="cap">at keyboard</text>
<path d="M0 190H1136" class="rule"/>
<text x="0" y="120" class="heading">Assistant</text><text x="0" y="146" class="cap">you start it</text><text x="0" y="170" class="cap">reply to you, now</text>
<text x="0" y="224" class="heading">Workflow</text><text x="0" y="250" class="cap">a trigger starts it</text><text x="0" y="274" class="cap">output queues for you</text>
<rect x="262" y="104" width="146" height="60" rx="10" class="box"/><text x="335" y="141" class="itext" text-anchor="middle">ask, reply</text>
<rect x="612" y="104" width="146" height="60" rx="10" class="box"/><text x="685" y="141" class="itext" text-anchor="middle">ask, reply</text>
<rect x="962" y="104" width="146" height="60" rx="10" class="box"/><text x="1035" y="141" class="itext" text-anchor="middle">ask, reply</text>
<rect x="435" y="104" width="150" height="60" rx="10" class="zone"/><text x="510" y="141" class="cap" text-anchor="middle">nothing runs</text>
<rect x="785" y="104" width="150" height="60" rx="10" class="zone"/><text x="860" y="141" class="cap" text-anchor="middle">nothing runs</text>
<rect x="280" y="208" width="110" height="60" rx="10" class="box"/><use href="#g-clock" x="292" y="224" width="28" height="28" class="i-warn"/><text x="330" y="245" class="itext">run</text>
<rect x="435" y="208" width="110" height="60" rx="10" class="box"/><use href="#g-clock" x="447" y="224" width="28" height="28" class="i-warn"/><text x="485" y="245" class="itext">run</text>
<rect x="785" y="208" width="110" height="60" rx="10" class="box"/><use href="#g-clock" x="797" y="224" width="28" height="28" class="i-warn"/><text x="835" y="245" class="itext">run</text>
<rect x="612" y="208" width="146" height="60" rx="10" class="focus"/><use href="#g-person" x="624" y="224" width="28" height="28" class="i-hi"/><text x="660" y="245" class="itext">review</text>
<rect x="962" y="208" width="146" height="60" rx="10" class="focus"/><use href="#g-person" x="974" y="224" width="28" height="28" class="i-hi"/><text x="1010" y="245" class="itext">review</text>
<path d="M545 238H610" class="line" marker-end="url(#arrow)"/>
<path d="M895 238H960" class="line" marker-end="url(#arrow)"/>
<text x="0" y="314" class="label">ILLUSTRATIVE · ONE WEEK, NOT TO SCALE · THIS DECK'S FRAMING</text>
</svg>
