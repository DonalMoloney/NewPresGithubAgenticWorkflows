<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Cycle diagram: the GitHub Octocat mark at the centre of a loop of six steps, Plan, Code, Test, Review, Open PR and Monitor, connected by glowing arrows">
<style>
.card { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 2; }
.ic { fill: none; stroke: #0969da; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.tt { fill: #1f2328; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .06em; text-anchor: middle; }
.td { fill: #59636e; font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
.wire { fill: none; stroke: #0969da; stroke-width: 2.5; }
.ring { fill: none; stroke: #afb8c1; }
.plate { fill: #ddf4ff; stroke: #afb8c1; stroke-width: 2; }
.bot { fill: #1f2328; }
.glow { }
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
