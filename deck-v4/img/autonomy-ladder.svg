<text x="485" y="122" class="heading">Consultant</text>
<rect x="485" y="134" width="25" height="22" rx="3" class="seal" style="fill:var(--accent)"/>
<rect x="513" y="134" width="25" height="22" rx="3" class="seal" style="fill:var(--accent)"/>
<rect x="541" y="134" width="25" height="22" rx="3" class="seal" style="fill:var(--accent)"/>
<rect x="569" y="134" width="25" height="22" rx="3" class="rule" style="stroke:var(--muted)"/>
<rect x="597" y="134" width="25" height="22" rx="3" class="rule" style="stroke:var(--muted)"/>
<rect x="625" y="134" width="25" height="22" rx="3" class="rule" style="stroke:var(--muted)"/>
<text x="485" y="184" class="text">Agent proposes</text>
